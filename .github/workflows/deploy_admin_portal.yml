name: Deploy Admin Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yegna-admin-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Check server and Worker types
        working-directory: server
        run: |
          npm run build
          npm run worker:check

      - name: Install admin web dependencies
        working-directory: admin-web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build admin portal
        working-directory: admin-web
        run: npm run build

      - name: Validate Worker bundle
        working-directory: admin-web
        run: npx wrangler deploy --config dist/yegna_health_admin_portal/wrangler.json --dry-run

      - name: Deploy to Cloudflare
        working-directory: admin-web
        run: npx wrangler deploy --config dist/yegna_health_admin_portal/wrangler.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
