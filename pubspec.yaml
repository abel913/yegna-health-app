name: yegna_health_app
description: An Android-first, bilingual health education and service app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_secure_storage: 9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  supabase_flutter: 2.15.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/learning/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-VariableFont_wdth,wght.ttf
